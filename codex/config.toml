# the-agent-kit - Codex hardening. Merge into ~/.codex/config.toml.
#
# Every key below was checked against the Codex config reference:
#   https://learn.chatgpt.com/docs/config-file/config-reference
# (Codex has no "ask" decision, so the tool guard DENIES where Claude Code would prompt.)

# Never stop to ask a person. A command the sandbox refuses goes to Codex's reviewer agent instead
# of to you: it approves routine escalations (a `git commit` needs one, because the sandbox keeps
# .git read-only), denies critical-risk ones, and fails closed. The tool guard still denies what
# Claude Code would ask about. With "never", every commit failed. Checked with codex-cli 0.165.0,
# `codex exec` included: the sandboxed commit hit .git/index.lock, the reviewer approved the retry.
# With codex-cli 0.166.0 the same `codex exec` commit went through on the first try.
# Valid values: on-request | never | { granular = { ... } }
approval_policy = "on-request"
approvals_reviewer = "auto_review"

# Confine writes to the workspace.
# Valid values: read-only | workspace-write | danger-full-access
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# Deliberately ON. The rules require checking library, API, and version behaviour against live
# documentation instead of recalling it, and that needs network. Turning this off does not make
# the agent safer - it makes it fall back on training data, which is the hallucination path
# those rules exist to close. Two rules that contradict each other are worse than either alone:
# the agent picks one arbitrarily.
# Set false when reviewing code you do not trust, and expect doc lookups to fail loudly.
network_access = true

# Deliberately NOT set: [shell_environment_policy].
# By default Codex passes every variable to commands, names with KEY, SECRET or TOKEN included
# (ignore_default_excludes defaults to true; seen with codex-cli 0.166.0). Keep real secrets out of the
# environment you start Codex from. Excluding by pattern breaks builds instead: patterns like "*_URL" or "*KEY*" strip DATABASE_URL, VITE_API_URL and KEYCLOAK_*
# out of the environment, so a command fails for a reason the agent cannot see - and it then
# invents a cause and "fixes" the wrong thing.
# If you must exclude a specific variable, name it explicitly and use the current `filters` field.
# The older `exclude` key still parses but is documented as legacy.

# The command-guard PreToolUse hook lives in codex/hooks.json (./install.sh merges it, or prints it with --print).

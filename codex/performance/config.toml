# the-agent-kit OPTIONAL performance profile for Codex (experiment, see the decision record in docs/senior-engineer.md).
# Merge by hand into ~/.codex/config.toml; never installed by default. Every key below is in the
# Codex configuration reference (learn.chatgpt.com/docs/config-file/config-reference and
# docs/agent-configuration/subagents). Copy the role files from codex/performance/agents/ into
# ~/.codex/agents/ (personal, not trust-gated) or .codex/agents/ (project, trust-gated).
#
# Model IDs are examples from the 2026-10 catalog: use what YOUR plan offers. `codex debug models` lists
# it, and it can differ from OpenAI's public model pages (a ChatGPT plan may not have the newest model yet).

model = "gpt-6-astra"              # the lead: the most capable model your plan provides
model_reasoning_effort = "medium"  # the setting under test; raise per task, not globally

[agents]
enabled = true
default_subagent_model = "gpt-6-sol"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 2   # excludes the primary thread. Codex also has max_depth
                                         # (documented as the v1 recursion limit); left unset, so nesting
                                         # is bounded by the orchestration rule instead
